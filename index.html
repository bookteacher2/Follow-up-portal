<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>24X CEO Follow-up</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top bar + role-based tabs (bottom bar on phones); one column of sections; task detail and forms open as a side sheet. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e9edeb; --line:#d5dcd9; --ink:#14201c; --ink2:#4b5a55; --ink3:#7b8a85;
  --accent:#0f6b55; --accent-ink:#ffffff; --accent-soft:#dcefe8;
  --ok:#1d7a3e; --ok-soft:#dff2e4; --ok-mid:#9dd8b1; --warn:#a35d00; --warn-soft:#fbecd3; --bad:#b3261e; --bad-soft:#f8dedb; --info:#245e9c; --info-soft:#dde9f6;
  --shadow:0 10px 30px rgba(20,32,28,.14);
  --f-display:"Archivo","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#17201d; --sunk:#111917; --line:#2a3632; --ink:#e6eeeb; --ink2:#a8b7b2; --ink3:#748581;
  --accent:#4cc39f; --accent-ink:#06231a; --accent-soft:#163a30;
  --ok:#5ccf83; --ok-soft:#173622; --ok-mid:#2f7a4a; --warn:#f0a940; --warn-soft:#3a2a10; --bad:#ff7d72; --bad-soft:#41191a; --info:#7fb2ec; --info-soft:#17283d;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#17201d; --sunk:#111917; --line:#2a3632; --ink:#e6eeeb; --ink2:#a8b7b2; --ink3:#748581;
  --accent:#4cc39f; --accent-ink:#06231a; --accent-soft:#163a30;
  --ok:#5ccf83; --ok-soft:#173622; --ok-mid:#2f7a4a; --warn:#f0a940; --warn-soft:#3a2a10; --bad:#ff7d72; --bad-soft:#41191a; --info:#7fb2ec; --info-soft:#17283d;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--accent)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand h1{font-size:18px;font-weight:800}
.brand span{font-size:12px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--ink2);font-weight:500;white-space:nowrap;position:relative}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.tabs a .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:99px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;text-align:center;line-height:18px}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.who img{width:24px;height:24px;border-radius:50%}
.role{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--ink2);font-weight:600;letter-spacing:.03em;white-space:nowrap}
.role.ceo{background:var(--warn-soft);color:var(--warn)}
.role.off{background:var(--accent-soft);color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding-block:20px 120px;display:flex;flex-direction:column;gap:22px}
.banner{padding:10px 14px;border-radius:10px;background:var(--info-soft);color:var(--info);font-size:13px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pagehead h2{font-size:24px;font-weight:800}
.pagehead>div{margin-right:auto}
.pagehead p{margin:4px 0 0;color:var(--ink2);max-width:68ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:var(--bad);background:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.lg{padding:11px 18px;font-size:15px;font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}
.kpi b{display:block;font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.warn b{color:var(--warn)} .kpi.bad b{color:var(--bad)} .kpi.ok b{color:var(--ok)}
section.block{display:flex;flex-direction:column;gap:10px}
.block-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.block-h h3{font-size:16px;font-weight:700}
.block-h .n{font-family:var(--f-mono);font-size:12px;color:var(--ink3)}
.block-h .sp{margin-left:auto}
.hint{font-size:12px;color:var(--ink3)}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--ink2);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button .c{font-family:var(--f-mono);font-size:11px;margin-left:5px;color:var(--ink3)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row .t{min-width:0}
.ref{font-family:var(--f-mono);font-size:11px;color:var(--ink3);margin-right:6px}
.row .topic{font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;font-size:12px;color:var(--ink2);align-items:center}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:110px}
/* approval rows */
.arow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;padding:14px;border-top:1px solid var(--line);align-items:start}
.arow:first-child{border-top:0}
.arow.sel{background:var(--accent-soft)}
.arow input[type=checkbox]{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.arow .body{min-width:0;cursor:pointer}
.arow .ttl{font-weight:700;font-size:15px;line-height:1.35}
.arow .desc{color:var(--ink2);font-size:13px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.arow .acts{display:flex;gap:6px;align-items:center}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:zoom-in;background:var(--sunk)}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--line);border-radius:7px;font-size:12px;text-decoration:none;color:var(--ink);background:var(--surface);max-width:100%}
.fchip b{font-family:var(--f-mono);font-size:10.5px;color:var(--accent);font-weight:600}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:9px;border:1px solid var(--line);cursor:zoom-in;max-width:100%;background:var(--sunk)}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--ink);color:var(--bg);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.actionbar .in{max-width:1100px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.actionbar .in span{margin-right:auto;font-weight:600}
.actionbar .btn{border-color:transparent}
/* detail list */
.tlist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.trow{display:grid;grid-template-columns:minmax(0,2fr) 140px 130px minmax(0,2fr) 92px;gap:12px;padding:11px 14px;border-top:1px solid var(--line);align-items:center;cursor:pointer}
.trow:first-child{border-top:0}
.trow:hover{background:var(--sunk)}
.trow.head{cursor:default;background:var(--sunk);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600;padding-block:8px}
.trow.head:hover{background:var(--sunk)}
.trow.red{box-shadow:inset 3px 0 0 var(--bad);background:var(--bad-soft)}
.trow.red:hover{background:color-mix(in srgb,var(--bad-soft) 80%,var(--bad) 20%)}
.trow.red .late,.trow.red .act.bad,.trow.red .act.warn{color:var(--ink)}
.trow.red .sub{color:var(--ink2)}
.trow.amber{box-shadow:inset 3px 0 0 var(--warn)}
.trow .c1{min-width:0}
.trow .tt{font-weight:600;line-height:1.35}
.trow .sub{font-size:12px;color:var(--ink3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .due{font-size:12.5px;font-variant-numeric:tabular-nums;line-height:1.4}
.trow .act{font-size:12.5px;font-weight:600;line-height:1.35}
.trow .act .lud{font-size:11.5px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums}
.trow .act .lud.old{color:var(--warn)}
.trow .act .lut{font-weight:400;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px}
.trow .act .lua{font-size:11.5px;margin-top:3px}
.trow .act .lua.bad{color:var(--bad)}.trow .act .lua.warn{color:var(--warn)}.trow .act .lua.info{color:var(--accent)}.trow .act .lua.ok{color:var(--ink3);font-weight:500}
.trow.red .act .lua{color:var(--bad)}
.act.bad{color:var(--bad)} .act.warn{color:var(--warn)} .act.ok{color:var(--ink3);font-weight:500} .act.info{color:var(--info)}
.trow .c5{text-align:right}
details.closed>summary{cursor:pointer;font-weight:700;font-size:16px;font-family:var(--f-display);list-style:none;display:flex;gap:10px;align-items:baseline}
details.closed>summary::-webkit-details-marker{display:none}
details.closed>summary::before{content:"▸";color:var(--ink3);font-size:13px}
details.closed[open]>summary::before{content:"▾"}
/* calendar */
.calhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.calhead h3{font-size:18px;min-width:150px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
.calgrid .dow{background:var(--sunk);font-size:11px;font-weight:600;color:var(--ink3);padding:6px 8px;text-transform:uppercase;letter-spacing:.06em}
.calgrid .day{background:var(--surface);min-height:96px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.calgrid .day.out{background:var(--bg)}
.calgrid .day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.calgrid .dn{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.ci{display:block;font-size:11.5px;line-height:1.3;padding:3px 6px;border-radius:5px;background:var(--info-soft);color:var(--info);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;text-align:left;width:100%;font-family:inherit}
.ci.bad{background:var(--bad);color:#fff} .ci.sub{background:var(--ok-soft);color:var(--ok)} .ci.done{background:var(--ok);color:#fff} .ci.closed{background:var(--sunk);color:var(--ink3);text-decoration:line-through}
.agenda{display:none;flex-direction:column;gap:10px}
.agenda .ad{display:flex;flex-direction:column;gap:4px}
.agenda .ad b{font-size:13px}
/* my tasks cards */
.mycards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mycard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.mycard.due{border-color:var(--warn)}
.mycard.late{border-color:var(--bad)}
.mycard .top{display:flex;gap:8px;align-items:flex-start}
.mycard .top .ttl{font-weight:700;font-size:15px;flex:1;min-width:0;cursor:pointer}
.mycard .why{font-size:12.5px;font-weight:600}
.mycard .why.warn{color:var(--warn)} .mycard .why.bad{color:var(--bad)} .mycard .why.ok{color:var(--ink3)}
.mycard .last{font-size:12.5px;color:var(--ink2);background:var(--sunk);border-radius:8px;padding:8px 10px}
.mycard .foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.st-not_started{background:var(--sunk);color:var(--ink2)}
.st-in_progress{background:var(--info-soft);color:var(--info)}
.st-on_hold{background:var(--sunk);color:var(--ink3)}
.st-submitted{background:var(--ok-soft);color:var(--ok)}
.st-returned{background:var(--bad-soft);color:var(--bad)}
.st-completed{background:var(--ok);color:#fff}
.st-failed{background:var(--bad-soft);color:var(--bad)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
button.fchip{cursor:pointer;font:inherit}
.st-cancelled{background:var(--sunk);color:var(--ink3);text-decoration:line-through}
.h-on_track{background:var(--ok-soft);color:var(--ok)} .h-at_risk{background:var(--warn-soft);color:var(--warn)} .h-blocked{background:var(--bad-soft);color:var(--bad)}
.fresh{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.fresh.ok{color:var(--ink3)} .fresh.warn{color:var(--warn)} .fresh.bad{color:var(--bad)}
.late{color:var(--bad);font-weight:600}
.bar{width:110px;height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.empty{padding:22px 16px;text-align:center;color:var(--ink3);font-size:13px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.filters input[type=search]{flex:1 1 220px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:40;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(700px,100%);height:100%;overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;display:flex;gap:10px;align-items:flex-start;z-index:2}
.sheet-h h2{font-size:19px;font-weight:700;flex:1;min-width:0}
.sheet-b{padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:18px;line-height:1;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h4{margin:0;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.card.hl{border-color:var(--warn)}
dl.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 12px;margin:0}
dl.kv dt{color:var(--ink3);font-size:12.5px}
dl.kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.steps div{font-size:11.5px;padding:6px 8px;border-radius:7px;background:var(--sunk);color:var(--ink3);text-align:center;font-weight:600}
.steps div.on{background:var(--accent-soft);color:var(--accent)}
.steps div.done{background:var(--ok-soft);color:var(--ok)}
.steps div.ret{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
form.f{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label,.fld>.lbl{font-size:13px;font-weight:600;color:var(--ink2)}
.fld label small,.fld .lbl small{font-weight:400;color:var(--ink3)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;width:100%}
.fld textarea{min-height:80px;resize:vertical}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick label{flex:1 1 110px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:center;background:var(--surface)}
.pick input{accent-color:var(--accent)}
.pick label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.pick label.r-ok:has(input:checked){border-color:var(--ok);background:var(--ok-soft)}
.pick label.r-warn:has(input:checked){border-color:var(--warn);background:var(--warn-soft)}
.pick label.r-bad:has(input:checked){border-color:var(--bad);background:var(--bad-soft)}
.slider{display:flex;gap:12px;align-items:center}
.slider input[type=range]{flex:1;accent-color:var(--accent);padding:0;border:0}
.slider output{font-family:var(--f-display);font-weight:800;font-size:22px;min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
.chk{display:flex;gap:10px;align-items:center;font-size:13.5px;font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.err{color:var(--bad);font-size:12.5px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.drop .files{display:flex;gap:6px;flex-wrap:wrap}
.tl{display:flex;flex-direction:column}
.tl .ev{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.tl .ev:first-child{border-top:0}
.tl .d{font-family:var(--f-mono);font-size:11px;color:var(--ink3)}
.tl .w{font-size:12px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tl .tx{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.flag{color:var(--bad);font-weight:600;font-size:12px}
/* roadmap */
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

.goal b{font-weight:600}
.goal p{margin:0;font-size:12.5px;color:var(--ink2)}

.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;align-items:end;height:150px;border-bottom:1px solid var(--line);padding-top:16px}
.col{display:flex;gap:2px;align-items:end;height:100%;justify-content:center}
.col i{width:28%;max-width:16px;border-radius:4px 4px 0 0;display:block}

table.t{width:100%;border-collapse:collapse;font-size:12.5px}

table.t td.n,table.t th.n{text-align:right}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;z-index:70;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.pre{white-space:pre-wrap;font-size:12.5px;background:var(--sunk);border-radius:8px;padding:10px;overflow-wrap:anywhere}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.qa{border-top:1px dashed var(--line);padding:10px 0;display:flex;flex-direction:column;gap:4px}
.qa:first-child{border-top:0;padding-top:0}
.qa .w{font-size:12px;color:var(--ink2)}

.pi{display:block;width:100%;text-align:left;border:0;font:inherit;font-size:11px;line-height:1.3;padding:2px 5px;border-radius:5px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--info-soft);color:var(--info)}

.ms:first-child{border-top:0}
.ms .md{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.ms .mt{min-width:0;overflow-wrap:anywhere}
.ms.past .md{color:var(--bad);font-weight:600}

.up{display:flex;flex-direction:column;gap:2px}
.up .day{font-weight:700;font-size:13px;margin-top:8px}
.up .it{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px;font-size:13px;padding:3px 0;cursor:pointer}
.up .it:hover{background:var(--sunk)}
.up .it .k{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase}
.up .it.bad .k{color:var(--bad)}
.cqrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.cqrow:first-child{border-top:0}
.cqbox{width:22px;height:22px;border:2px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;margin-top:1px;color:#fff}
.cqrow.yes .cqbox,.cqrow.note .cqbox{background:var(--ok);border-color:var(--ok)}
.cqrow.no .cqbox{background:var(--bad);border-color:var(--bad)}
.cqrow.yes .cqtx,.cqrow.note .cqtx,.cqrow.no .cqtx{color:var(--ink2)}
.cqtx{font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.cqrow .ans{margin-top:6px;padding:7px 10px;background:var(--sunk);border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
.cqact{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cqact input{flex:1 1 220px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0}
.cqrec summary{cursor:pointer;margin-top:6px}

.chip.cq-yes{background:var(--ok-soft);color:var(--ok)}.chip.cq-no{background:var(--bad-soft);color:var(--bad)}.chip.cq-note{background:var(--info-soft);color:var(--info)}
.cqrow{grid-template-columns:30px minmax(0,2fr) minmax(0,2fr) minmax(180px,1.2fr)!important}
.cqrow input[type=checkbox]{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ok);cursor:pointer}
.cqrow.cqhead{background:var(--sunk);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600;padding-block:8px}

.cqn{font-family:var(--f-mono);color:var(--ink3);margin-right:2px}
.cqqe{display:flex;gap:6px;align-items:flex-start}.cqqe .cqn{padding-top:7px}
.cqrow textarea.cqtxin{font-weight:600;font-size:14px}

.cqrow.cqnewrow{background:var(--bg)}
.cqrow.cqnewrow textarea{border-style:dashed}
.cqrow textarea,.cqrow select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;min-width:0;font-size:13px}
.cqrow textarea{resize:vertical;min-height:38px}
.cqlk{margin-top:6px;font-size:12.5px}
.cqcmv{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
.lnk{border:0;background:none;color:var(--bad);cursor:pointer;padding:0;font:inherit;font-size:12px}
@media (max-width:820px){.cqrow{grid-template-columns:30px minmax(0,1fr)!important}.cqrow>div:nth-child(n+3){grid-column:2}.cqrow.cqhead{display:none}}
.whoami{display:flex;flex-direction:column;gap:12px;max-width:560px}

  .kpis,.kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr))}

  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;flex-wrap:nowrap;overflow-x:auto;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}

<script>
(() => {
const STALE_DAYS = 7;
const BUS = ["VERTE","IES","Group"];
const CATS = ["Process Improvement","Transformation","Reporting & Governance","Business Analysis","Digital & Systems","Strategy & Planning","Commercial & Partnership","People & Organisation","Project / Operation Control","Ad-hoc Request"];
const PRIOS = ["Critical","High","Medium","Low"];
const ST = {not_started:"Not started",in_progress:"In progress",on_hold:"On hold",submitted:"Completed · to confirm",returned:"Returned by CEO",completed:"Completed · confirmed",cancelled:"Cancelled",failed:"Not achieved"};
const HL = {on_track:"On track",at_risk:"At risk",blocked:"Blocked"};
const ACTIVE = ["not_started","in_progress","on_hold","returned"];
const DEFAULT_ROADMAP = {pillars:[{name:"Management Mechanisms",goals:[]},{name:"Operational Excellence",goals:[]},{name:"Special Project",goals:[]}]};
const MS = "Microsoft 365";
const IMGPDF = {png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",pdf:"application/pdf"};
const OFFICE = {ppt:"application/vnd.ms-powerpoint",pptx:"application/vnd.openxmlformats-officedocument.presentationml.presentation",doc:"application/msword",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",xls:"application/vnd.ms-excel",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"};
const MAXPACK = 14*1024*1024;

const S = {tasks:[], appr:{}, req:{}, reqOff:{}, officeIds:[], roles:{}, downloads:null, ceoId:null, roadmap:null, directory:[], filesCfg:null, members:{}, myNames:null,
  me:null, isOwner:false, db:null, user:null, mcp:null, assets:null, fileArgs:null, profiles:{},
  f:{q:"",status:"open",bu:"",pillar:"",pic:"",cat:""}, ceoTab:"done", cal:null, calShow:"open", open:null, mode:"view", readonly:false, loaded:false, sel:new Set(), pending:[], ceoq:[], qAns:{}, cqWeek:null};
let unsubAppr=null, unsubReq=null, unsubOff=[], unsubQ=null;

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nowIso = () => new Date().toISOString();
const todayStr = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const dayMs = 86400000;
const dayStart = d => { const x=new Date(d); x.setHours(0,0,0,0); return x.getTime(); };
const daysSince = iso => iso ? Math.round((dayStart(Date.now())-dayStart(iso))/dayMs) : null;
const daysUntil = ymd => ymd ? Math.round((new Date(ymd+"T00:00:00").getTime()-new Date(todayStr()+"T00:00:00").getTime())/dayMs) : null;
const fmtD = s => { if(!s) return "—"; const d=new Date(s.length===10?s+"T00:00:00":s); return isNaN(d)?"—":d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"2-digit"}); };
const ago = iso => { const n=daysSince(iso); return n==null?"never":n===0?"today":n===1?"yesterday":n+" days ago"; };
const name = id => id==="import" ? "CEO Office" : id==="claude" ? "Claude" : ((S.members[id]&&(S.members[id].names||[])[0]&&canon(S.members[id].names[0])) || (S.profiles[id]&&S.profiles[id].name) || (id===S.me?.id ? (S.me.name||"You") : "Someone"));
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }
const isCeo = () => !!(S.previewCeo || (S.me?.id && S.ceoId && S.me.id===S.ceoId));
const isOffice = () => !S.previewCeo && !!(S.me?.id && S.officeIds.includes(S.me.id));
const canWrite = () => !S.previewCeo && !!S.db && !S.readonly && !!S.me?.id;
const splitNames = s => String(s||"").split(/[,/+&]| and /).map(x=>x.replace(/\(.*?\)/g,"").trim()).filter(Boolean);
function canon(n){ const d=S.directory.find(x=>norm(x.name)===norm(n)||(x.aliases||[]).some(a=>norm(a)===norm(n))); return d?d.name:n; }
const picList = t => [...new Set(splitNames(t.pic).map(canon))];
const supList = t => [...new Set(splitNames(t.support).map(canon))];
const norm = s => s.toLowerCase().replace(/\s+/g,"");
function myNames(){ const n=[...(S.myNames||[])]; if(S.isOwner) n.push("CEO Office"); return [...new Set(n.map(canon))].map(norm); }
function myRole(t){ const m=myNames(); if(!m.length) return null; if(picList(t).some(p=>m.includes(norm(p)))) return "lead"; if(supList(t).some(p=>m.includes(norm(p)))) return "support"; return null; }

// effective state, from records only the CEO can write
function reqRec(t){
  if(!t.request) return null;
  const r=S.req[t.id]; if(r && r.requestAt===t.request.at) return r;
  const o=S.reqOff[t.id]; if(o && o.requestAt===t.request.at && ["cancel","failed"].includes(t.request.type) && S.officeIds.includes(o.by)) return o;
  return null;
}
function pendingReq(t){ return t.request && !reqRec(t) ? t.request : null; }
function closedAs(t){ const r=reqRec(t); if(r && r.decision==="approved" && ["cancel","failed"].includes(t.request.type)) return t.request.type; return (t.cancelledBy && t.cancelledBy===S.ceoId) ? "cancel" : null; }
const isCancelled = t => !!closedAs(t);
const reqLabel = pr => pr.type==="cancel" ? "Cancel requested" : pr.type==="failed" ? "Close as not achieved requested" : "New date requested";
function effTarget(t){ const r=reqRec(t); return (r && r.decision==="approved" && t.request.type==="timeline") ? t.request.newTarget : t.target; }
function eff(t){
  const cl=closedAs(t); if(cl) return cl==="cancel"?"cancelled":"failed";
  const a=S.appr[t.id], sub=t.completion?.submittedAt;
  if(a && sub && a.submittedAt===sub) return a.decision==="approved" ? "completed" : "returned";
  if(sub && (t.status==="submitted"||t.status==="completed")) return "submitted";
  if(["completed","submitted","cancelled"].includes(t.status)) return "in_progress";
  return t.status||"not_started";
}
function health(t){
  const e=eff(t), tg=effTarget(t), fc=t.forecast||"", act=ACTIVE.includes(e);
  const out={late:false,lateBy:0,stale:false,staleDays:daysSince(t.lastUpdateAt),target:tg,forecast:fc,expected:(fc&&tg&&fc>tg)?fc:(tg||fc),needDate:false,delayed:false};
  out.dueIn=daysUntil(out.expected);
  if(act&&tg&&daysUntil(tg)<0){ out.late=true; out.lateBy=-daysUntil(tg); }
  out.needDate = out.late && (!fc || daysUntil(fc)<0);
  out.delayed = act && (out.late || (fc&&tg&&fc>tg));
  if(act && !(e==="not_started"||!t.start||!tg) && out.staleDays!=null && out.staleDays>STALE_DAYS) out.stale=true;
  return out;
}
const approvedAt = t => (eff(t)==="completed" ? S.appr[t.id]?.at : null);
const lastUpdate = t => { const u=(t.updates||[]).filter(x=>x.text&&!/^(File|Link) added$/.test(x.kind||"")); return u[u.length-1]; };
const lastHealth = t => { const u=(t.updates||[]).filter(x=>x.health); return u.length?u[u.length-1].health:null; };
async function resolveProfiles(){
  if(!S.user) return;
  const ids=new Set();
  S.tasks.forEach(t=>{ if(t.createdBy&&!["import","claude"].includes(t.createdBy)) ids.add(t.createdBy); (t.updates||[]).forEach(u=>u.by&&!["import","claude"].includes(u.by)&&ids.add(u.by)); (t.files||[]).forEach(f=>f.by&&ids.add(f.by)); });
  Object.keys(S.members).forEach(i=>ids.add(i)); if(S.ceoId) ids.add(S.ceoId);
  if(!ids.size) return;
  try{ const ps=await S.user.profiles([...ids]); let ch=false; for(const k in ps){ if(!S.profiles[k]||S.profiles[k].name!==ps[k].name){S.profiles[k]=ps[k];ch=true;} } if(ch) render(); }catch(e){}
}

// ---------- routing ----------
function routesFor(){
  if(isCeo()) return [["ceo","CEO view"],["checklist","CEO checklist"],["week","Next 7 days"],["calendar","Calendar"],["tasks","All tasks"],["roadmap","Roadmap"],["insights","Insights"]];
  if(S.isOwner) return [["follow","Follow-up"],["my","My tasks"],["ceo","CEO view"],["checklist","CEO checklist"],["week","Next 7 days"],["calendar","Calendar"],["tasks","All tasks"],["roadmap","Roadmap"],["insights","Insights"],["setup","Setup"]];
  return [["my","My tasks"],["week","Next 7 days"],["calendar","Calendar"],["tasks","All tasks"]];
}
const route = () => { const h=location.hash.replace("#",""), rs=routesFor().map(r=>r[0]); return rs.includes(h)?h:rs[0]; };
window.addEventListener("hashchange", ()=>{ render(true); window.scrollTo(0,0); });

// ---------- render ----------
function render(force){
  const ae=document.activeElement, FIL=["fq","fstatus","fbu","fpillar","fcat","fpic"];
  const typing = ae && ae.closest && ae.closest("#app") && /^(INPUT|TEXTAREA)$/.test(ae.tagName) && !FIL.includes(ae.id) && ae.type!=="checkbox";
  if(typing && !force){ renderSheet(); return; }
  const r=route();
  const waitN=S.tasks.filter(t=>eff(t)==="submitted").length + S.tasks.filter(t=>pendingReq(t)&&!isCancelled(t)).length;
  const myDue=S.tasks.filter(t=>myRole(t)&&ACTIVE.includes(eff(t))&&!pendingReq(t)&&["bad","warn"].includes(nextAction(t)[0])).length;

// ---------- shared pieces ----------
function filesOf(t){ return t.files||[]; }
const isImg = f => /^image\//.test(f.type||"") || /\.(png|jpe?g|gif|webp)$/i.test(f.name||"");
const extOf = f => ((f.name||"").split(".").pop()||"link").slice(0,4).toUpperCase();
function thumbs(t,max=4){
  const fs=filesOf(t), imgs=fs.filter(isImg), docs=fs.filter(f=>!isImg(f));
  if(!fs.length) return "";
  return `<div class="thumbs">${imgs.slice(0,max).map(f=>`<img src="${esc(f.url)}" alt="${esc(f.name)}" data-zoom="${esc(f.url)}" loading="lazy">`).join("")}${docs.slice(0,3).map(fileChip).join("")}${fs.length>max+3?`<span class="hint">+${fs.length-max-3} more</span>`:""}</div>`;
}
const fileChip = f => f.kind==="packed" ? `<button type="button" class="fchip" data-dl="${esc(f.url)}" data-dlname="${esc(f.name)}" data-dltype="${esc(f.type||"")}" title="Download ${esc(f.name)}"><b>${esc(extOf(f))}</b><span>${esc(f.name)}</span></button>` : `<a class="fchip" href="${esc(f.url)}" target="_blank" rel="noopener" title="${esc(f.name)}"><b>${esc(f.kind==="link"?"LINK":extOf(f))}</b><span>${esc(f.name)}</span></a>`;
function dueText(t){
  const h=health(t), tg=h.target;
  if(!tg) return `<span class="hint">No target date</span>`;
  if(h.delayed){
    const nd = h.forecast ? `<span class="${daysUntil(h.forecast)<0?"late":""}">New date ${fmtD(h.forecast)}</span>` : `<b class="late">No new date</b>`;
    return `<span class="late">Due ${fmtD(tg)}${h.late?` · ${h.lateBy}d late`:""}</span><br>${nd}`;
  }
  return `Due ${fmtD(tg)}${h.dueIn!=null&&h.dueIn<=7&&h.dueIn>=0&&ACTIVE.includes(eff(t))?` <b style="color:var(--warn)">(${h.dueIn}d)</b>`:""}`;
}
function nextAction(t){
  const e=eff(t), h=health(t), pr=pendingReq(t), lu=lastUpdate(t);
  if(e==="completed") return ["ok",`Confirmed by CEO ${fmtD(S.appr[t.id]?.at)}`];
  if(e==="failed"||e==="cancelled") return ["ok",(e==="failed"?"Not achieved: ":"Cancelled: ")+(t.request?.reason||"")];
  if(openCeoQ(t)) return ["bad","CEO asked a question: reply in the task"];
  if(e==="submitted") return ["ok",`Done. CEO to tick confirm`];
  if(e==="returned") return ["bad","CEO returned it: fix and resubmit"];
  if(pr) return ["info","Waiting for CEO on your request"];
  if(h.needDate) return ["bad",h.forecast?`Missed new date ${fmtD(h.forecast)}: set another`:`Overdue ${h.lateBy}d: set a new finish date`];
  if(h.stale) return ["warn",`No update for ${h.staleDays} days: update now`];
  if(lastHealth(t)==="blocked") return ["bad","Blocked: needs CEO decision"];
  if(notStarted(t)) return ["ok",!t.start||!effTarget(t)?"Not started: set start and target dates when it begins":"Not started yet"];
  const recent = h.staleDays!=null && h.staleDays<=STALE_DAYS;
  if(h.dueIn!=null&&h.dueIn>=0&&h.dueIn<=7) return recent ? ["ok",`Due ${h.dueIn===0?"today":"in "+h.dueIn+"d"} · updated ${ago(t.lastUpdateAt)}`] : ["warn",`Due in ${h.dueIn}d: finish or update`];
  const nextBy=lu?new Date(new Date(t.lastUpdateAt).getTime()+STALE_DAYS*dayMs).toISOString():null;
  return ["ok",`On track${nextBy?` · next update by ${fmtD(nextBy)}`:""}`];
}
function taskRow(t,opts={}){
  const e=eff(t), h=health(t), lu=lastUpdate(t), hl=lastHealth(t), pr=pendingReq(t), [ac,at]=nextAction(t);
  const red = h.needDate||e==="returned"||(h.delayed&&ACTIVE.includes(e)), amber=!red&&(h.stale||ac==="warn");
  const nf=(t.files||[]).length;

  const closed=["completed","failed","cancelled","submitted"].includes(e), showAct=ac!=="ok"||closed;
  const luAge=lu?daysSince(lu.at):null;
  const luHtml=lu?`<div class="lud ${ACTIVE.includes(e)&&luAge>STALE_DAYS?"old":""}">${fmtD(lu.at)} · ${ago(lu.at)}${lu.by?` · ${esc(name(lu.by))}`:""}</div><div class="lut" title="${esc(lu.text)}">${esc((lu.text||"").replace(/\s+/g," "))}${lu.next?` <span style="color:var(--ink3)">→ Next: ${esc(lu.next)}</span>`:""}</div>`:`<div class="lud old">No update yet</div>`;
  const canUpd = opts.update && canWrite() && ACTIVE.includes(e);
  return `<div class="trow ${red?"red":amber?"amber":""}" data-open="${t.id}">
    <div class="c1"><div class="tt"><span class="ref">${esc(t.ref||"")}</span>${esc(t.topic)}</div><div class="sub">${sub}</div></div>

    <div class="st">${opts.update&&myRole(t)==="support"?`<span class="chip">You support</span> `:""}<span class="chip st-${e}">${ST[e]}</span>${hl&&ACTIVE.includes(e)&&hl!=="on_track"?` <span class="chip h-${hl}">${HL[hl]}</span>`:""}${pr?`<div style="margin-top:3px"><span class="chip st-submitted">${reqLabel(pr)}</span></div>`:""}</div>
    <div class="act">${luHtml}${showAct?`<div class="lua ${ac}">${ac==="ok"?"":"▲ "}${esc(at)}</div>`:""}</div>
    <div class="c5">${canUpd?`<button class="btn sm ${red||amber?"primary":""}" data-update="${t.id}">Update</button>`:`<span class="hint">${ACTIVE.includes(e)?`upd. ${ago(t.lastUpdateAt)}`:""}</span>`}</div>
  </div>`;
}
const listHead = `<div class="trow head"><div>Task</div><div>Due</div><div>Status</div><div>Last update</div><div></div></div>`;
const listOf = (arr,emptyMsg,opts) => `<div class="tlist">${arr.length?listHead+arr.map(t=>taskRow(t,opts)).join(""):`<div class="empty">${emptyMsg}</div>`}</div>`;
const buChips = () => `<div class="seg" role="group" aria-label="Business unit">${["",...BUS].map(b=>`<button data-fbu="${b}" aria-pressed="${S.f.bu===b}">${b||"All BUs"}<span class="c">${S.tasks.filter(t=>!b||t.bu===b).filter(t=>ACTIVE.includes(eff(t))||eff(t)==="submitted").length}</span></button>`).join("")}</div>`;
const openQs = t => (t.qa||[]).filter(q=>!q.answer);
const openCeoQ = t => openQs(t).some(q=>q.fromCeo);
function keyDates(tasks){
  const out=[];
  tasks.forEach(t=>{ const e=eff(t);
    if(ACTIVE.includes(e)){ const h=health(t); if(h.expected) out.push({t,date:h.expected,kind:"due",title:h.delayed?"New finish date":"Due date",bad:h.delayed}); }
    (t.milestones||[]).forEach(m=>{ if(!m.done&&!["cancelled","failed"].includes(e)) out.push({t,date:m.date,time:m.time,kind:m.kind,title:m.title,link:m.link,bad:m.date<todayStr()}); });
  });
  return out.sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
}
function upcomingCard(tasks,label){
  const from=todayStr(), to=new Date(Date.now()+7*dayMs), toS=to.getFullYear()+"-"+String(to.getMonth()+1).padStart(2,"0")+"-"+String(to.getDate()).padStart(2,"0");
  const all=keyDates(tasks), items=all.filter(x=>x.date>=from&&x.date<=toS), missed=all.filter(x=>x.kind!=="due"&&x.date<from);
  const days={}; items.forEach(x=>{ (days[x.date]=days[x.date]||[]).push(x); });

  return `<section class="card"><div class="block-h"><h3>${mon?"This week":"Coming up"}: next 7 days</h3><span class="n">${items.length}</span><span class="hint">${label}</span>${items.length?`<span class="sp"></span><button class="btn sm" data-act="copyup" data-scope="${label}">Copy summary</button>`:""}</div>
    ${items.length?`<div class="up">${body}</div>`:`<p class="hint" style="margin:0">No due dates, key dates or meetings in the next 7 days.</p>`}

function upcomingText(tasks){

const notStarted = t => ACTIVE.includes(eff(t)) && (eff(t)==="not_started" || !t.start || !effTarget(t));

// ---------- All tasks ----------
function filtered(){
  const f=S.f, q=f.q.toLowerCase();
  return S.tasks.filter(t=>{
    const e=eff(t), h=health(t);
    if(f.status==="open" && !ACTIVE.includes(e) && e!=="submitted") return false;
    if(f.status==="stale" && !h.stale) return false;
    if(f.status==="late" && !h.delayed) return false;
    if(f.status==="closed" && !["failed","cancelled"].includes(e)) return false;
    if(f.status==="help" && !(ACTIVE.includes(e)&&(lastUpdate(t)?.needCeo||lastHealth(t)==="blocked"))) return false;
    if(!["","open","stale","late","help","closed"].includes(f.status) && e!==f.status) return false;
    if(f.bu && t.bu!==f.bu) return false;
    if(f.pillar && t.pillar!==f.pillar) return false;
    if(f.cat && t.category!==f.cat) return false;
    if(f.pic && ![...picList(t),...supList(t)].some(p=>norm(p)===norm(f.pic))) return false;
    if(q && !(`${t.ref} ${t.topic} ${t.details} ${t.pic} ${t.support} ${t.objective} ${t.workstream}`.toLowerCase().includes(q))) return false;
    return true;
  }).sort((a,b)=>{ if(S.sort!=="urgent") return refNum(a)-refNum(b); const ha=health(a),hb=health(b); return (hb.needDate-ha.needDate)||(hb.lateBy-ha.lateBy)||((hb.stale?hb.staleDays:0)-(ha.stale?ha.staleDays:0))||refNum(a)-refNum(b); });
}
function refNum(t){ const m=/(\d+)\s*$/.exec(t.ref||""); return m?+m[1]:1e6+(t.start?Date.parse(t.start)/1e8:0); }
const pillarsList = () => (S.roadmap||DEFAULT_ROADMAP).pillars.map(p=>p.name);
const allPics = () => [...new Set(S.tasks.flatMap(t=>[...picList(t),...supList(t)]))].sort((a,b)=>a.localeCompare(b));

function calItems(){
  const f=S.f;
  return S.tasks.filter(t=>{
    const e=eff(t);
    if(S.calShow==="open" && !(ACTIVE.includes(e)||e==="submitted")) return false;

    if(f.pic && ![...picList(t),...supList(t)].some(p=>norm(p)===norm(f.pic))) return false;

  }).map(t=>{ const e=eff(t), h=health(t); const d=ACTIVE.includes(e)?h.expected:(effTarget(t)||h.expected);
    const cls = ACTIVE.includes(e) ? (h.delayed?"bad":"") : e==="submitted"?"sub":e==="completed"?"done":"closed";
    return {t,d,cls,h}; }).filter(x=>x.d).concat(S.calKeys===false?[]:S.tasks.filter(t=>(!f.bu||t.bu===f.bu)&&(!f.pic||[...picList(t),...supList(t)].some(p=>norm(p)===norm(f.pic)))).flatMap(t=>(t.milestones||[]).map(m=>({t,d:m.date,cls:"kd"+(m.kind==="meeting"?" mtg":""),h:health(t),m}))));

function ciBtn(x){ if(x.m){ const st=piState(x.m); return `<button class="pi ${st}" data-open="${x.t.id}" data-ptab-open="1" title="${esc(PK[x.m.kind].lb+": "+x.m.title+" · "+x.t.ref+" "+x.t.topic)}"><span class="ic">${PK[x.m.kind].ic}</span>${x.m.time?esc(x.m.time)+" ":""}${esc(x.m.title)}</button>`; } const tip=`${x.t.ref} ${x.t.topic} · ${x.t.pic||""}${x.h.delayed?` · was due ${fmtD(x.h.target)}`:""}`; return `<button class="ci ${x.cls}" data-open="${x.t.id}" title="${esc(tip)}">${x.h.delayed?"⚠ ":""}${esc(x.t.topic)}</button>`; }
function vCal(){
  const now=new Date(); if(!S.cal) S.cal={y:now.getFullYear(),m:now.getMonth()};
  const {y,m}=S.cal, first=new Date(y,m,1), startDow=(first.getDay()+6)%7, days=new Date(y,m+1,0).getDate();

    cells.push(`<div class="day ${d.getMonth()!==m?"out":""} ${k===todayStr()?"today":""}"><span class="dn">${d.getDate()}</span>${its.map(ciBtn).join("")}</div>`); }
  const monthKeys=Object.keys(by).filter(k=>k.startsWith(key(y,m,1).slice(0,7))).sort();
  const overdueBefore=items.filter(x=>x.cls==="bad"&&x.d<key(y,m,1));
  const o=(v,l,cur)=>`<option value="${esc(v)}" ${v===cur?"selected":""}>${esc(l)}</option>`;
  return `<div class="pagehead"><div><h2>Calendar</h2><p>Due dates by day. Delayed tasks are red and sit on their new finish date; hover or open one to see the original date.</p></div></div>
  <div class="filters">${buChips()}

    <span class="legend" style="margin-left:auto"><span>◆ Deliverable</span><span>● Meeting</span><span>↻ Follow-up</span><span><i style="background:var(--bad)"></i>Delayed</span><span><i style="background:var(--info-soft)"></i>Open</span><span><i style="background:var(--ok-mid)"></i>Completed, to confirm</span><span><i style="background:var(--ok)"></i>Confirmed</span></span></div>

// ---------- Insights ----------
function hbars(rows){ const max=Math.max(1,...rows.map(r=>r.v)); return `<div class="hbars">${rows.map(r=>`<div class="hb"><span class="lab" title="${esc(r.k)}">${esc(r.k)}</span><div class="stack" style="height:10px">${r.parts.map(p=>`<i style="width:${p.v/max*100}%;background:${p.c}"></i>`).join("")}</div><span class="num">${r.v}</span></div>`).join("")||`<div class="empty">No data yet.</div>`}</div>`; }
function vInsights(){

  </div></div>
  <div class="legend"><span><i style="background:var(--ok)"></i>Confirmed</span><span><i style="background:var(--ok-mid)"></i>Completed, to confirm</span><span><i style="background:var(--info)"></i>Open</span></div>
  <div class="grid2">

  </div>

function renderSheet(){
  const L=$("#layer");
  if(!S.open){ L.innerHTML=""; L.dataset.key=""; document.body.style.overflow=""; return; }
  document.body.style.overflow="hidden";
  const t = S.open==="new" ? null : S.tasks.find(x=>x.id===S.open);
  if(S.open!=="new" && !t){ S.open=null; L.innerHTML=""; return; }
  const key=[S.open,S.mode,S.ptab,S.pcal&&(S.pcal.y+'-'+S.pcal.m),S.pday,S.psel,t&&(t.milestones||[]).length,t&&(t.milestones||[]).filter(m=>m.done).length,S.msRes&&(S.msRes.loading+'/'+S.msRes.items.length+'/'+S.msRes.q),t&&(t.qa||[]).length,t&&openQs(t).length,t&&(t.updates||[]).length,t&&(t.files||[]).length,t&&eff(t),t&&t.status,t&&S.appr[t.id]?.at,t&&S.req[t.id]?.at,t&&t.request?.at,isCeo(),Object.keys(S.profiles).length,S.pending.length].join("|");
  if(L.dataset.key===key && L.firstChild) return;
  const keepScroll=L.querySelector(".sheet")?.scrollTop||0;
  L.dataset.key=key;
  let inner;
  if(S.open==="new"||S.mode==="edit") inner=sheetForm(t);
  else if(S.mode==="update") inner=sheetUpdate(t);
  else if(S.mode==="complete") inner=sheetComplete(t);
  else if(S.mode==="timeline"||S.mode==="close") inner=sheetRequest(t,S.mode);
  else inner=sheetTask(t);
  const sameMode = L.dataset.km===S.open+"|"+S.mode, saved={};
  if(sameMode) L.querySelectorAll("input[id],textarea[id],select[id]").forEach(el=>{ if(el.type!=="file"&&el.id!=="ms_date") saved[el.id]=el.type==="checkbox"?el.checked:el.value; });
  const radio = sameMode ? (L.querySelector("input[name=u_h]:checked")||{}).value : null;
  L.dataset.km=S.open+"|"+S.mode;
  L.innerHTML=`<div class="scrim" data-act="close"><div class="sheet gut" role="dialog" aria-modal="true">${inner}</div></div>`;
  for(const id in saved){ const el=document.getElementById(id); if(!el) continue; if(el.type==="checkbox") el.checked=saved[id]; else el.value=saved[id]; }
  if(radio){ const r=L.querySelector(`input[name=u_h][value="${radio}"]`); if(r) r.checked=true; }
  if(saved.c_mreq){ $("#c_mt").hidden=false; $("#c_mo").hidden=false; }

}

function autoPlan(texts,t){
  const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12}, today=todayStr(), out=[];
  const re=/\b(\d{1,2})\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b|\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})\b|\b(\d{1,2})\s*\/\s*(\d{1,2})(?:\s*\/\s*\d{2,4})?\b/ig;
  const yr=new Date().getFullYear();
  texts.filter(Boolean).forEach(txt=>String(txt).split(/\n|(?<=\.)\s/).forEach(line=>{
    if(/New finish date/i.test(line)) return; let m; re.lastIndex=0;
    while((m=re.exec(line))){ let d,mo; if(m[1]){d=+m[1];mo=MON[m[2].toLowerCase()];} else if(m[3]){d=+m[4];mo=MON[m[3].toLowerCase()];} else {d=+m[5];mo=+m[6]; if(mo<1||mo>12) continue;}
      let ds=`${yr}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`; if(ds<today && daysUntil(ds)<-60) ds=`${yr+1}`+ds.slice(4); if(ds<today) continue;
      const title=line.replace(/\s+/g," ").trim().replace(/^[-•\s]+/,"").slice(0,90); const low=title.toLowerCase();
      const kind=/meet|workshop|review|present|discuss|kick-?off|session|uat|ประชุม|นัด/.test(low)?"meeting":/follow|check|chase|appoint|ตาม/.test(low)?"followup":"deliverable";
      if((t.milestones||[]).concat(out).some(x=>x.date===ds&&x.title.slice(0,25)===title.slice(0,25))) continue;
      out.push({id:Date.now().toString(36)+out.length,date:ds,time:"",kind,title,link:"",by:S.me.id,at:nowIso(),auto:true}); }
  }));
  return out;
}

function errMsg(e){ return e&&(e.code==="invalid_argument"||e.code==="permission-denied") ? "You don't have permission for this change." : e&&(e.code==="quota_exceeded"||e.code==="resource-exhausted") ? "The portal's storage is full. Ask the CEO Office to archive old tasks." : "Couldn't save. Check your connection and try again."; }
async function guard(fn, errEl){
  if(!canWrite()){ toast("You don't have permission to change tasks."); return false; }
  try{ await fn(); return true; } catch(e){ if(errEl) errEl.textContent=errMsg(e); else toast(errMsg(e)); return false; }
}
const tref = id => S.db.collection("tasks").doc(id);
function nextRef(){ let n=0; S.tasks.forEach(t=>{ const m=/^T-(\d+)$/.exec(t.ref||""); if(m) n=Math.max(n,+m[1]); }); return "T-"+String(n+1).padStart(3,"0"); }
async function saveTask(form){
  const g=id=>{const el=form.querySelector("#"+id); return el?el.value.trim():"";}, err=form.querySelector("#terr");
  const t = S.open!=="new" ? S.tasks.find(x=>x.id===S.open) : null;
  const ws=g("t_ws"), rm=S.roadmap||DEFAULT_ROADMAP, pil=(rm.pillars.find(p=>(p.goals||[]).some(x=>x.name===ws))||{}).name||(t?t.pillar:"")||"";
  const body={topic:g("t_topic"),details:g("t_details"),objective:g("t_obj"),deliverables:g("t_obj"),pic:g("t_pic"),support:g("t_sup"),bu:g("t_bu")||"Group",category:g("t_cat"),pillar:pil,workstream:ws};
  if(!t){ body.start=todayStr(); body.target=g("t_target"); }
  const newTarget = (t && isOffice()) ? g("t_target") : "";
  if(t && isOffice() && !newTarget){ err.textContent="Set a target date."; return; }
  if(!body.topic||!body.objective||!body.pic||(!t&&!body.target)){ err.textContent="Fill in what needs to be done, the outcome, the PIC"+(t?"":" and the target date")+"."; return; }
  await guard(async()=>{
    if(t){
      const oldTarget=effTarget(t)||"";
      if(newTarget && newTarget!==oldTarget){ body.target=newTarget; if(t.request&&t.request.type==="timeline") body.request=null; }
      const changes=Object.keys(body).filter(k=>k!=="request"&&(t[k]||"")!==body[k]&&!(k==="target"&&newTarget===oldTarget));
      const updates=[...(t.updates||[])]; if(changes.length&&S.live) updates.push({at:nowIso(),by:S.me.id,kind:"Brief edited",text:"Changed: "+changes.map(k=>k==="pic"?`PIC ${t.pic||"—"} → ${body.pic}`:k==="support"?`Support ${t.support||"—"} → ${body.support}`:k==="target"?`Target ${fmtD(oldTarget)} → ${fmtD(body.target)}`:k==="topic"?`Topic ${t.topic||"—"} → ${body.topic}`:k==="bu"?`BU ${t.bu||"—"} → ${body.bu}`:k).join(", ")});
      await tref(t.id).update({...body,updates}); S.mode="view"; toast("Saved");
    } else {
      const ref=S.db.collection("tasks").doc(), now=nowIso();
      await ref.set({...body,ref:nextRef(),status:"not_started",progress:0,createdBy:S.me.id,createdAt:now,lastUpdateAt:now,files:[],updates:[{at:now,by:S.me.id,kind:"Created",text:"Task created"+(isCeo()?" by the CEO":"")}]});
      if(S.cqLink){ try{ await S.db.collection("ceoq").doc(S.cqLink).update({taskId:ref.id}); }catch(e){} S.cqLink=null; S.cqPrefill=""; }
      S.open=ref.id; S.mode="view"; toast("Task created");
    }
    render(true);
  }, err);
}
async function postUpdate(form,t){
  const g=id=>form.querySelector("#"+id), err=form.querySelector("#uerr");
  const text=g("u_text").value.trim(); if(!text){ err.textContent="Write what you finished since the last update."; return; }
  if(S.pending.some(p=>p.task===t.id&&!p.err)){ err.textContent="Wait for the files to finish uploading."; return; }
  const hl=(form.querySelector("input[name=u_h]:checked")||{}).value||"on_track";
  const h=health(t), fc=g("u_fc").value, why=g("u_why").value.trim(), prev=h.forecast||h.target||"";
  if(h.needDate && (!fc || fc<todayStr())){ err.textContent="This task is past its date. Set a new finish date (today or later)."; return; }
  const moved = fc && fc!==prev;
  if(moved && h.target && fc>h.target && !why){ err.textContent="Say briefly why it will finish later than "+fmtD(h.target)+"."; return; }
  const u={at:nowIso(),by:S.me.id,health:hl,text,next:g("u_next").value.trim(),needCeo:g("u_ceo").checked||hl==="blocked",onBehalf:g("u_for")?g("u_for").value.trim():""};
  const patch={status:"in_progress",lastUpdateAt:u.at};
  if(moved){ u.newDate=fc; u.text+=`\nNew finish date: ${fmtD(fc)} (was ${fmtD(prev)})${why?". Reason: "+why:""}`; patch.forecast=fc; if(fc>(h.target||"")) patch.forecastLog=[...(t.forecastLog||[]),{at:u.at,by:S.me.id,from:prev,to:fc,reason:why}]; }
  const auto=autoPlan([u.next,text],t); if(auto.length){ patch.milestones=[...(t.milestones||[]),...auto]; u.planned=auto.length; }
  patch.updates=[...(t.updates||[]),u];
  const ok=await guard(async()=>{ await tref(t.id).update(patch); }, err);
  if(ok){ S.mode="view"; toast(u.planned?`Update posted. ${u.planned} date(s) added to the plan`:"Update posted. Thank you"); render(true); }
}

async function submitRequest(form,t,kind){
  const err=form.querySelector("#rerr"), reason=form.querySelector("#r_reason").value.trim(), nd=kind==="timeline"?form.querySelector("#r_date").value:"";
  const type = kind==="timeline" ? "timeline" : ((form.querySelector("input[name=r_type]:checked")||{}).value||"failed");

  const at=nowIso(), request={type,newTarget:nd,reason,at,by:S.me.id};
  const kindTxt = type==="timeline"?"New date requested":type==="cancel"?"Cancellation requested":"Close as failed requested";
  const ok=await guard(async()=>{ await tref(t.id).update({request,lastUpdateAt:at,updates:[...(t.updates||[]),{at,by:S.me.id,kind:kindTxt,text:(nd?`New target ${fmtD(nd)} (was ${fmtD(effTarget(t))}). `:"")+reason}]}); }, err);
  if(!ok) return;
  const direct = isCeo() || (type!=="timeline" && isOffice());
  if(direct){ const fresh={...t,request,updates:[...(t.updates||[])]}; try{ await decideRequest(fresh,"approved",""); }catch(e){ err.textContent="Saved, but the closing record didn't go through. Try again from the task."; return; } }

async function decide(t,decision,comment){
  const sub=t.completion?.submittedAt; if(!sub) return;
  const at=nowIso(), prev=S.appr[t.id];
  const rec={taskId:t.id,ref:t.ref||"",decision,comment:comment||"",at,submittedAt:sub,history:[...((prev&&prev.history)||[]),{decision,comment:comment||"",at,submittedAt:sub}].slice(-20)};
  if(S.previewCeo){ S.appr[t.id]=rec; return; }
  await S.db.collection("approvals/"+S.me.id+"/t").doc(t.id).set(rec);
  S.appr[t.id]=rec;
  try{ await tref(t.id).update({status:decision==="approved"?"completed":"returned",lastUpdateAt:at,updates:[...(t.updates||[]),{at,by:S.me.id,kind:decision==="approved"?"CEO approved":"CEO returned",text:comment||(decision==="approved"?"Approved as complete":"Returned")}]}); }catch(e){}
}
async function decideRequest(t,decision,comment){
  const r=t.request; if(!r) return;
  const at=nowIso();
  const rec={taskId:t.id,type:r.type,newTarget:r.newTarget||"",requestAt:r.at,decision,comment:comment||"",at,by:S.me.id};
  if(S.previewCeo){ S.req[t.id]=rec; return; }
  await S.db.collection("approvals/"+S.me.id+"/r").doc(t.id).set(rec);
  if(isCeo()) S.req[t.id]=rec; else S.reqOff[t.id]=rec;
  const cur=S.tasks.find(x=>x.id===t.id)||t;
  const patch={updates:[...(cur.updates||[]),{at,by:S.me.id,kind:`${isCeo()?"CEO":"CEO Office"} ${decision} ${r.type==="cancel"?"cancellation":r.type==="failed"?"closing as failed":"date change"}`,text:comment||(r.type==="cancel"?"Cancelled":r.type==="failed"?"Closed as not completed":"New target "+fmtD(r.newTarget))+(decision==="approved"?"":" (rejected)")}]};
  if(decision==="approved"&&r.type==="timeline"){ patch.target=r.newTarget; patch.originalTarget=cur.originalTarget||cur.target||""; patch.revisions=[...(cur.revisions||[]),{from:cur.target||"",to:r.newTarget,at,reason:r.reason}]; }
  if(decision==="approved"&&(r.type==="cancel"||r.type==="failed")){ patch.status=r.type==="cancel"?"cancelled":"failed"; patch.closedBy=S.me.id; }
  try{ await tref(t.id).update(patch); }catch(e){}
}

// files
function payloadText(res){ if(res==null) return ""; if(typeof res.payload==="string") return res.payload; if(res.payload!=null) return JSON.stringify(res.payload); if(Array.isArray(res.content)) return res.content.map(c=>c.text||"").join("\n"); return JSON.stringify(res); }
function collectObjs(v,out){ if(Array.isArray(v)) v.forEach(x=>collectObjs(x,out)); else if(v&&typeof v==="object"){ if(v.driveId&&v.id&&v.name) out.push(v); Object.values(v).forEach(x=>collectObjs(x,out)); } return out; }
function parseFolders(res){
  let out=[]; if(res&&res.payload&&typeof res.payload==="object") out=collectObjs(res.payload,[]);
  if(!out.length){ const s=payloadText(res); try{ out=collectObjs(JSON.parse(s),[]); }catch(e){ s.split(/}\s*{/).forEach((p,i,a)=>{ try{ collectObjs(JSON.parse((i?"{":"")+p+(i<a.length-1?"}":"")),out); }catch(_){} }); } }
  const seen=new Set(); return out.filter(o=>!seen.has(o.id)&&seen.add(o.id));
}
const toB64 = file => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=()=>rej(r.error); r.readAsDataURL(file); });
async function uploadOne(file,t){
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  if(!S.assets) throw new Error("uploads aren't available on this view; add a link instead");
  if(IMGPDF[ext]){
    try{ const r=await S.assets.upload(file,{type:IMGPDF[ext]}); return {kind:"asset",id:r.id,url:r.url||("/_blob/"+r.id),name:file.name,type:r.contentType,size:r.sizeBytes}; }
    catch(e){ throw new Error(e&&e.code==="too_large"?"over 20 MB":"upload failed"); }
  }
  if(file.size>MAXPACK) throw new Error("over 14 MB; add a SharePoint link instead");
  const b64=await toB64(file);
  try{ const r=await S.assets.upload(new Blob([b64],{type:"text/plain"}),{type:"text/plain"}); return {kind:"packed",id:r.id,url:r.url||("/_blob/"+r.id),name:file.name,type:file.type||"application/octet-stream",size:file.size}; }
  catch(e){ throw new Error(e&&e.code==="too_large"?"too large; add a link instead":"upload failed"); }
}
async function downloadPacked(url,nm,type){
  if(!S.downloads){ toast("Downloads aren't available on this view."); return; }
  try{
    const txt=await (await fetch(url)).text(); const bin=atob(txt.trim()); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    await S.downloads.save({filename:nm,data:new Blob([u8],{type:type||"application/octet-stream"})});
  }catch(e){ if(e&&e.code==="cancelled") return; toast("Couldn't open that file."); }
}
async function handleFiles(files,t){
  if(!canWrite()) return;
  for(const file of files){
    const p={task:t.id,name:file.name}; S.pending.push(p); render();
    try{
      const f=await uploadOne(file,t); f.by=S.me.id; f.at=nowIso();
      const cur=S.tasks.find(x=>x.id===t.id)||t;
      await tref(t.id).update(S.live?{files:[...(cur.files||[]),f],updates:[...(cur.updates||[]),{at:f.at,by:S.me.id,kind:"File added",text:f.name}],lastUpdateAt:f.at}:{files:[...(cur.files||[]),f]});
      cur.files=[...(cur.files||[]),f];
      S.pending=S.pending.filter(x=>x!==p);
    }catch(e){ p.err=(e&&e.message)||"upload failed"; if(e&&e.code==="not_granted") p.err="Microsoft 365 access wasn't allowed"; else if(e&&e.code==="tool_error") p.err="SharePoint refused it (check the folder is shared with you)"; setTimeout(()=>{S.pending=S.pending.filter(x=>x!==p); render();},9000); }
    render();
  }
}
async function addLink(t,url,nm){
  if(!/^https?:\/\//i.test(url)){ toast("Paste a full link starting with https://"); return false; }
  const f={kind:"link",url,name:nm||url.split("/").pop().split("?")[0]||"Link",type:"",by:S.me.id,at:nowIso()};
  return guard(async()=>{ await tref(t.id).update(S.live?{files:[...(t.files||[]),f],updates:[...(t.updates||[]),{at:f.at,by:S.me.id,kind:"Link added",text:f.name}],lastUpdateAt:f.at}:{files:[...(t.files||[]),f]}); toast("Link added"); });
}
async function sendMail(p){
  const em=emailFor(p), arr=(reminderGroups().find(x=>x[0]===p)||[])[1]||[]; if(!em||!arr.length) return false;
  const body=reminderText(p,arr).split("\n\n").map(par=>"<p>"+esc(par).replace(/\n/g,"<br>")+"</p>").join("");
  await S.mcp.callTool(MS,"outlook_send_mail",{to:[em],subject:`Follow-up: ${arr.length} task(s) need your update`,body,bodyType:"html"});
  return true;
}

document.addEventListener("drop", ev=>{ const d=ev.target.closest&&ev.target.closest("[data-drop],.sheet"); document.querySelectorAll("[data-drop]").forEach(x=>x.classList.remove("over")); if(!d||!S.open||S.open==="new") return; ev.preventDefault(); const t=S.tasks.find(x=>x.id===S.open); const fl=[...(ev.dataTransfer?.files||[])]; if(t&&fl.length) handleFiles(fl,t); });
document.addEventListener("keydown", ev=>{ if(ev.key==="Enter"&&!ev.shiftKey&&!ev.isComposing&&ev.target.id==="cq_new"){ ev.preventDefault(); addCqText(ev.target.value); } });
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape"){ if($("#lb").innerHTML){ $("#lb").innerHTML=""; return; } if(S.open){ S.open=null; S.mode="view"; render(true); } } });

async function exportAll(btn){
  if(!S.db){ toast("The task list isn't loaded yet."); return; }
  const label=btn.textContent;
  const once=q=>new Promise((res,rej)=>{ let u=null,done=false; u=q.onSnapshot(sn=>{ if(done) return; done=true; setTimeout(()=>{ try{u&&u();}catch(e){} },0); res(sn); }, e=>{ if(!done){ done=true; rej(e); } }); });
  const docs=[];
  const addColl=async p=>{ const sn=await once(S.db.collection(p)); sn.docs.forEach(d=>docs.push({path:p+"/"+d.id,data:d.data()})); };
  const addDoc=async p=>{ const sn=await once(S.db.doc(p)); if(sn.exists) docs.push({path:p,data:sn.data()}); };
  btn.disabled=true; btn.textContent="Exporting…";
  try{
    await addColl("tasks"); await addColl("members").catch(()=>{}); await addColl("ceoq").catch(()=>{});
    for(const c of ["roles","directory","roadmap","settings","files","access"]) await addDoc("config/"+c).catch(()=>{});
    const ids=[...new Set([...(S.officeIds||[]),S.ceoId].filter(Boolean))];
    for(const id of ids) for(const sub of ["t","r","q"]) await addColl(`approvals/${id}/${sub}`).catch(()=>{});
    const blobs={}; let nf=0, miss=[];
    for(const d of docs.filter(x=>x.path.startsWith("tasks/"))) for(const f of (d.data.files||[])){
      if(!(f.kind==="asset"||f.kind==="packed")||!f.id||blobs[f.id]) continue;
      try{ const b=await (await fetch(f.url)).blob(); blobs[f.id]={type:f.kind==="packed"?"text/plain":(f.type||b.type||"application/octet-stream"),name:f.name||"",b64:await toB64(b)}; nf++; btn.textContent=`Exporting files… ${nf}`; }
      catch(e){ miss.push(f.name||f.id); }
    }
    const out={format:"24x-followup-export",version:1,exportedAt:nowIso(),exportedBy:S.me?.id||"",officeIds:S.officeIds||[],ceoId:S.ceoId||"",docs,blobs};
    const fname=`24x-followup-${window.fbPortal?"backup":"export"}-${todayStr()}.json`;
    if(S.downloads) await S.downloads.save({filename:fname,data:new Blob([JSON.stringify(out)],{type:"application/json"})});
    else { const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:"application/json"})); a.download=fname; a.click(); }
    const nt=docs.filter(x=>x.path.startsWith("tasks/")).length;
    toast(`Saved ${nt} tasks and ${nf} files`+(miss.length?`. ${miss.length} file(s) could not be read: ${miss.slice(0,3).join(", ")}`:""));
  }catch(e){ if(!(e&&e.code==="cancelled")) toast("Export failed. Try again."); }
  btn.disabled=false; btn.textContent=label;
}
// ---------- boot ----------
async function boot(){
  render(true);
  const [user, db] = await Promise.all([claude.use("user"), claude.use("db")]);
  S.user=user; S.db=db;
  if(user){ S.me=await user.me(); S.isOwner=await user.isOwner(); const cw=await user.can("data.write"); if(cw===false) S.readonly=true; }
  if(!db){ S.loaded=true; render(true); return; }
  claude.use("downloads").then(d=>{ S.downloads=d; });
  claude.use("mcp").then(m=>{ S.mcp=m; });
  claude.use("assets").then(a=>{ S.assets=a; });
  let got=0; const ready=()=>{ if(++got>=3) S.loaded=true; render(); };
  db.collection("tasks").onSnapshot(snap=>{ S.tasks=snap.docs.map(d=>({id:d.id,...d.data()})); ready(); resolveProfiles(); }, e=>{ S.loaded=true; render(); });
  db.doc("config/roles").onSnapshot(s=>{ S.roles=s.exists?{...s.data()}:{}; const id=S.roles.ceoId||null, offs=S.roles.officeIds||[]; if(id!==S.ceoId||offs.join()!==S.officeIds.join()){ S.ceoId=id; S.officeIds=offs; subAppr(); resolveProfiles(); } ready(); });
  db.collection("members").onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ m[d.id]=d.data(); }); S.members=m; if(S.me?.id&&m[S.me.id]&&S.myNames==null) S.myNames=m[S.me.id].names||null; ready(); resolveProfiles(); });
  db.doc("config/roadmap").onSnapshot(s=>{ S.roadmap=s.exists?s.data():null; render(); });
  db.doc("config/directory").onSnapshot(s=>{ S.directory=s.exists?(s.data().people||[]):[]; render(); });
  db.doc("config/settings").onSnapshot(s=>{ S.live=!!(s.exists&&s.data().live); S.liveAt=s.exists?s.data().liveAt:""; render(); });
  db.doc("config/files").onSnapshot(s=>{ S.filesCfg=s.exists?s.data():null; render(); });
  db.collection("ceoq").onSnapshot(snap=>{ S.ceoq=snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, e=>{});
}
function subAppr(){
  if(unsubAppr){ unsubAppr(); unsubAppr=null; } if(unsubReq){ unsubReq(); unsubReq=null; } unsubOff.forEach(u=>u()); unsubOff=[]; S.appr={}; S.req={}; S.reqOff={}; if(unsubQ){ unsubQ(); unsubQ=null; } S.qAns={};
  const offs={}; S.officeIds.forEach(oid=>{ unsubOff.push(S.db.collection("approvals/"+oid+"/r").onSnapshot(snap=>{ offs[oid]={}; snap.docs.forEach(d=>{ offs[oid][d.id]={...d.data(),by:oid}; }); const m={}; Object.values(offs).forEach(o=>Object.assign(m,o)); S.reqOff=m; render(); })); });
  if(!S.ceoId) return;
  unsubQ=S.db.collection("approvals/"+S.ceoId+"/q").onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ m[d.id]=d.data(); }); S.qAns=m; render(); }, e=>{});
  unsubAppr=S.db.collection("approvals/"+S.ceoId+"/t").onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ m[d.id]=d.data(); }); S.appr=m; render(); });
  unsubReq=S.db.collection("approvals/"+S.ceoId+"/r").onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ m[d.id]={...d.data(),by:S.ceoId}; }); S.req=m; render(); });
}
boot();
})();
</script>
